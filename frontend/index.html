<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Primary SEO -->
    <title>Habitify — Complete Quests. Build Streaks. Become Better</title>
    <meta
      name="description"
      content="Habitify helps you build consistent habits, track your daily progress, and stay motivated to become your best self."
    />
    <meta
      name="keywords"
      content="habit tracker, habit tracking, daily habits, productivity, personal growth, routines, goal tracking"
    />
    <meta name="author" content="Habitify" />
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://yourdomain.com/" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/fav.png" />
    <link rel="apple-touch-icon" href="/fav.png" />

    <!-- Mobile / Theme -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <meta name="application-name" content="Habitify" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Habitify — Build Better Habits" />
    <meta
      property="og:description"
      content="Track your habits, build consistency, and make meaningful progress every day with Habitify."
    />
    <meta property="og:url" content="https://yourdomain.com/" />
    <meta property="og:site_name" content="Habitify" />
    <meta property="og:image" content="https://yourdomain.com/og-image.png" />
    <meta
      property="og:image:alt"
      content="Habitify habit tracking dashboard"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Habitify — Build Better Habits" />
    <meta
      name="twitter:description"
      content="Track your habits, build consistency, and make meaningful progress every day."
    />
    <meta name="twitter:image" content="https://yourdomain.com/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Habitify habit tracking dashboard"
    />

    <!-- Performance -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
